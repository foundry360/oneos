version: '3.8'

# Fabric-only services - Run this in WSL2 Ubuntu
# Other services (backend, frontend, postgres, etc.) run in Docker Desktop on Windows

services:
  # Hyperledger Fabric CA
  fabric-ca:
    image: hyperledger/fabric-ca:1.5.7
    container_name: fabric-ca
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/ca:/etc/hyperledger/fabric-ca-server-config
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/ca:/etc/hyperledger/fabric-ca-server
    command: sh -c "fabric-ca-server start -b admin:adminpw"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/hyperledger/fabric-ca-server-config/ca-cert.pem || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hyperledger Fabric Orderer
  fabric-orderer:
    image: hyperledger/fabric-orderer:2.5.7
    container_name: fabric-orderer
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/channel-artifacts/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
    volumes:
      - ./fabric-network/channel-artifacts:/var/hyperledger/orderer/channel-artifacts
      - ./fabric-network/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderer
    command: orderer
    networks:
      - default
    depends_on:
      - fabric-ca
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/hyperledger/orderer/orderer.genesis.block || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hyperledger Fabric Peer
  fabric-peer:
    image: hyperledger/fabric-peer:2.5.7
    container_name: fabric-peer
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_PEER=info
      - CORE_LOGGING_LEVEL=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
    ports:
      - "7051:7051"
      - "7052:7052"
      - "7053:7053"
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/users:/etc/hyperledger/fabric/users
      - ./fabric-network/channel-artifacts:/etc/hyperledger/fabric/channel-artifacts
      - ./fabric-network/chaincode:/opt/gopath/src/github.com
      - ./fabric-network/scripts/add-hosts.sh:/usr/local/bin/add-hosts.sh
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        ORDERER_IP=$$(getent hosts fabric-orderer | awk '{print $$1}')
        PEER_IP=$$(getent hosts fabric-peer | awk '{print $$1}')
        echo "$$ORDERER_IP orderer.example.com" >> /etc/hosts
        echo "$$PEER_IP peer0.org1.example.com" >> /etc/hosts
        exec peer node start
    networks:
      - default
    depends_on:
      - fabric-orderer
    healthcheck:
      test: ["CMD-SHELL", "peer node status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Explorer Database
  explorer-db:
    image: postgres:15-alpine
    container_name: explorer-db
    environment:
      - DATABASE_DB=explorer
      - DATABASE_USERNAME=explorer
      - DATABASE_PASSWORD=explorerpw
      - POSTGRES_USER=explorer
      - POSTGRES_PASSWORD=explorerpw
      - POSTGRES_DB=explorer
    ports:
      - "5433:5432"
    volumes:
      - explorer_db_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chaincode Service (External CCAAS)
  chaincode-governance-ledger:
    build:
      context: ./fabric-network/chaincode/governance-ledger
      dockerfile: Dockerfile
    container_name: chaincode-governance-ledger
    environment:
      - CHAINCODE_ID=governance-ledger:1.0
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
    ports:
      - "9999:9999"
    networks:
      - default
    depends_on:
      - fabric-peer
      - fabric-orderer

  # Hyperledger Explorer
  explorer:
    image: ghcr.io/hyperledger-labs/explorer:latest
    container_name: explorer
    environment:
      - DATABASE_HOST=explorer-db
      - DATABASE_DATABASE=explorer
      - DATABASE_USERNAME=explorer
      - DATABASE_PASSWD=explorerpw
      - LOG_LEVEL_APP=info
      - LOG_LEVEL_DB=info
      - LOG_LEVEL_CONSOLE=info
      - LOG_CONSOLE_STDOUT=true
      - DISCOVERY_AS_LOCALHOST=false
      - PORT=8080
      - EXPLORER_NETWORK_NAME=governance-network
    ports:
      - "8080:8080"
    volumes:
      - ./fabric-network/connection-profile.json:/opt/explorer/app/platform/fabric/connection-profile.json
      - ./fabric-network/explorer-config.json:/opt/explorer/app/platform/fabric/config.json
      - ./fabric-network/crypto-config:/tmp/crypto
      - explorer_wallet:/opt/explorer/wallet
    networks:
      - default
    depends_on:
      explorer-db:
        condition: service_healthy
      fabric-peer:
        condition: service_started
      fabric-orderer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  explorer_db_data:
  explorer_wallet:

networks:
  default:
    name: fabric-network

