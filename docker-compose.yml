version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-gov-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aigov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigov_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai_governance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigov}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: ai-gov-pubsub
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    environment:
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID:-ai-gov-local}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai-gov-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-gov-backend
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aigov}:${POSTGRES_PASSWORD:-aigov_secret}@postgres:5432/${POSTGRES_DB:-ai_governance}
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=${PUBSUB_PROJECT_ID:-ai-gov-local}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - STORAGE_PATH=/app/storage
      - LOG_PATH=/app/logs
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-us-central1}
      - FABRIC_ENABLED=true
      - FABRIC_CHANNEL_NAME=governance-channel
      - FABRIC_CHAINCODE_NAME=governance-ledger
      - FABRIC_CONNECTION_PROFILE=/app/fabric-network/connection-profile.json
      - FABRIC_WALLET_PATH=/app/fabric-network/wallet
      - FABRIC_USER_ID=Admin@org1.example.com
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./fabric-network:/app/fabric-network
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-gov-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL:-https://lraufigpyabmkwmibntm.supabase.co}}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYXVmaWdweWFibWt3bWlibnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwMTI2MTIsImV4cCI6MjA4NDU4ODYxMn0.BH2Yg-27zCmdpJvdvb7TM-bKieETdka6B6mJ0SG2NGM}}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # Hyperledger Fabric CA
  fabric-ca:
    image: hyperledger/fabric-ca:1.5.7
    container_name: fabric-ca
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.org1.example.com
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    ports:
      - "7054:7054"
      - "9443:9443"
    volumes:
      - ./fabric-network/crypto-config:/etc/hyperledger/fabric-ca-server-config
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-server version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hyperledger Fabric Orderer
  fabric-orderer:
    image: hyperledger/fabric-orderer:2.5.7
    container_name: fabric-orderer
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/channel-artifacts/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
    volumes:
      - ./fabric-network/channel-artifacts:/var/hyperledger/orderer/channel-artifacts
      - ./fabric-network/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./fabric-network/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderer
    command: orderer
    networks:
      - default
    depends_on:
      - fabric-ca
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/hyperledger/orderer/orderer.genesis.block || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hyperledger Fabric Peer
  fabric-peer:
    image: hyperledger/fabric-peer:2.5.7
    container_name: fabric-peer
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_PEER=info
      - CORE_LOGGING_LEVEL=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
    ports:
      - "7051:7051"
      - "7052:7052"
      - "7053:7053"
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls
      - ./fabric-network/crypto-config/peerOrganizations/org1.example.com/users:/etc/hyperledger/fabric/users
      - ./fabric-network/channel-artifacts:/etc/hyperledger/fabric/channel-artifacts
      - ./fabric-network/chaincode:/opt/gopath/src/github.com
      - ./fabric-network/scripts/add-hosts.sh:/usr/local/bin/add-hosts.sh
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        ORDERER_IP=$$(getent hosts fabric-orderer | awk '{print $$1}')
        PEER_IP=$$(getent hosts fabric-peer | awk '{print $$1}')
        echo "$$ORDERER_IP orderer.example.com" >> /etc/hosts
        echo "$$PEER_IP peer0.org1.example.com" >> /etc/hosts
        exec peer node start
    networks:
      - default
    depends_on:
      - fabric-orderer
    healthcheck:
      test: ["CMD-SHELL", "peer node status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Explorer Database
  explorer-db:
    image: postgres:15-alpine
    container_name: explorer-db
    environment:
      - DATABASE_DB=explorer
      - DATABASE_USERNAME=explorer
      - DATABASE_PASSWORD=explorerpw
      - POSTGRES_USER=explorer
      - POSTGRES_PASSWORD=explorerpw
      - POSTGRES_DB=explorer
    ports:
      - "5433:5432"
    volumes:
      - explorer_db_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # External Chaincode Service (bypasses Docker build issues on Windows)
  chaincode-governance-ledger:
    image: governance-ledger:1.0
    container_name: chaincode-governance-ledger
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CHAINCODE_ID=governance-ledger:1.0
      - CORE_CHAINCODE_ID_NAME=governance-ledger:1.0
    ports:
      - "9999:9999"
    networks:
      - default
    command: node server.js

  # Hyperledger Explorer
  explorer:
    image: ghcr.io/hyperledger-labs/explorer:latest
    container_name: explorer
    environment:
      - DATABASE_HOST=explorer-db
      - DATABASE_DATABASE=explorer
      - DATABASE_USERNAME=explorer
      - DATABASE_PASSWD=explorerpw
      - LOG_LEVEL_APP=info
      - LOG_LEVEL_DB=info
      - LOG_LEVEL_CONSOLE=info
      - LOG_CONSOLE_STDOUT=true
      - DISCOVERY_AS_LOCALHOST=false
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./fabric-explorer/examples/net1/config.json:/opt/explorer/app/platform/fabric/config.json
      - ./fabric-explorer/examples/net1/connection-profile:/opt/explorer/app/platform/fabric/connection-profile
      - ./fabric-network/crypto-config:/tmp/crypto
      - explorer_wallet:/opt/explorer/wallet
    networks:
      - default
    depends_on:
      explorer-db:
        condition: service_healthy
      fabric-peer:
        condition: service_started
      fabric-orderer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    # Uncomment if image doesn't exist - will need to build from source
    # build:
    #   context: ./explorer-build
    #   dockerfile: Dockerfile

volumes:
  postgres_data:
  pgadmin_data:
  explorer_db_data:
  explorer_wallet:

