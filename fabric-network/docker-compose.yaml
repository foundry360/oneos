version: '3.8'

networks:
  fabric-network:
    name: fabric-network
    driver: bridge

services:
  # Hyperledger Fabric CA
  fabric-ca:
    image: hyperledger/fabric-ca:1.5.7
    container_name: fabric-ca
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.org1.example.com
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    ports:
      - "7054:7054"
      - "9443:9443"
    volumes:
      - ./crypto-config:/etc/hyperledger/fabric-ca-server-config
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    networks:
      - fabric-network
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-server version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hyperledger Fabric Orderer
  fabric-orderer:
    image: hyperledger/fabric-orderer:2.5.7
    container_name: fabric-orderer
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
    volumes:
      - ./channel-artifacts:/var/hyperledger/orderer
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com:/var/hyperledger/orderer
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderer
    command: orderer
    networks:
      - fabric-network
    depends_on:
      - fabric-ca
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/hyperledger/orderer/orderer.genesis.block || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Hyperledger Fabric Peer
  fabric-peer:
    image: hyperledger/fabric-peer:2.5.7
    container_name: fabric-peer
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric-network
      - CORE_LOGGING_LEVEL=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    ports:
      - "7051:7051"
      - "7052:7052"
      - "7053:7053"
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com:/etc/hyperledger/fabric
      - ./channel-artifacts:/etc/hyperledger/fabric/channel-artifacts
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    networks:
      - fabric-network
    depends_on:
      - fabric-orderer
    healthcheck:
      test: ["CMD-SHELL", "peer node status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Explorer Database
  explorer-db:
    image: postgres:15-alpine
    container_name: explorer-db
    environment:
      - DATABASE_DB=explorer
      - DATABASE_USERNAME=explorer
      - DATABASE_PASSWORD=explorerpw
      - POSTGRES_USER=explorer
      - POSTGRES_PASSWORD=explorerpw
      - POSTGRES_DB=explorer
    ports:
      - "5433:5432"
    volumes:
      - explorer_db_data:/var/lib/postgresql/data
    networks:
      - fabric-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hyperledger Explorer
  explorer:
    image: hyperledger/explorer-db:latest
    container_name: explorer
    environment:
      - DATABASE_HOST=explorer-db
      - DATABASE_DATABASE=explorer
      - DATABASE_USERNAME=explorer
      - DATABASE_PASSWD=explorerpw
      - EXPLORER_CONFIG_FILE_PATH=/opt/explorer/app/platform/fabric/config.json
      - EXPLORER_APP_CONFIG_FILE_PATH=/opt/explorer/app/explorerconfig.json
    ports:
      - "8080:8080"
    volumes:
      - ./explorer:/opt/explorer/app/platform/fabric
      - ./crypto-config:/tmp/crypto
    networks:
      - fabric-network
    depends_on:
      - explorer-db
      - fabric-peer
      - fabric-orderer
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  explorer_db_data:




